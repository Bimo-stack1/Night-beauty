<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night Beauty Store</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .dark {
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .dark .bg-white {
            background-color: #2d2d2d;
            color: #ffffff;
        }
        .dark .bg-gray-50 {
            background-color: #3d3d3d;
            color: #ffffff;
        }
        .dark .text-gray-700 {
            color: #ffffff;
        }
        .dark .border-b {
            border-color: #404040;
        }
        .dark input {
            background-color: #404040;
            color: #ffffff;
            border-color: #505050;
        }
        .preview-image {
            max-width: 200px;
            max-height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body class="bg-gray-100">
    <!-- Dark Mode Toggle -->
    <div class="fixed top-4 right-4 z-50">
        <button onclick="toggleDarkMode()" class="bg-gray-800 text-white px-4 py-2 rounded-full">
            🌓 Toggle Theme
        </button>
    </div>

    <!-- Login Screen -->
    <div id="loginScreen" class="container mx-auto p-8">
        <div class="max-w-md mx-auto bg-white rounded-lg shadow p-6">
            <h2 class="text-2xl font-bold text-center mb-6">Night Beauty Store Login</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-gray-700">Email</label>
                    <input type="email" id="email" class="w-full p-2 border rounded" required>
                </div>
                <div>
                    <label class="block text-gray-700">Password</label>
                    <input type="password" id="password" class="w-full p-2 border rounded" required>
                </div>
                <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">
                    Login
                </button>
            </form>
        </div>
    </div>

    <!-- Inventory Management Screen -->
    <div id="inventoryScreen" class="container mx-auto p-8 hidden">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-4xl font-bold">Night Beauty Store</h1>
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded">Logout</button>
        </div>

        <!-- Add/Edit Product Form -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <form id="itemForm" class="space-y-4">
                <input type="text" id="name" placeholder="Beauty Product Name" class="w-full p-2 border rounded" required>
                <input type="number" id="price" placeholder="Price" class="w-full p-2 border rounded" required>
                <input type="number" id="quantity" placeholder="Quantity" class="w-full p-2 border rounded" required>
                <input type="text" id="category" placeholder="Category (e.g., Skincare, Makeup)" class="w-full p-2 border rounded" required>
                
                <!-- Image Upload -->
                <div>
                    <label class="block text-gray-700 mb-2">Product Image</label>
                    <input type="file" id="image" accept="image/*" class="w-full p-2 border rounded" onchange="previewImage(event)">
                    <img id="imagePreview" class="preview-image mt-2 hidden">
                </div>

                <button type="submit" class="w-full bg-blue-500 text-white p-2 rounded hover:bg-blue-600">
                    Add Beauty Product
                </button>
            </form>
        </div>

        <!-- Search -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <input type="text" id="search" placeholder="Search beauty products..." class="w-full p-2 border rounded">
        </div>

        <!-- Products Table -->
        <div class="bg-white rounded-lg shadow overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-gray-50">
                        <th class="p-4 text-left">Product Image</th>
                        <th class="p-4 text-left">Product Name</th>
                        <th class="p-4 text-left">Price</th>
                        <th class="p-4 text-left">Quantity</th>
                        <th class="p-4 text-left">Category</th>
                        <th class="p-4 text-left">Actions</th>
                    </tr>
                </thead>
                <tbody id="itemsList"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Login credentials
        const validCredentials = {
            email: 'admin@example.com',
            password: 'admin123'
        };

        // Dark mode toggle
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            localStorage.setItem('darkMode', document.body.classList.contains('dark'));
        }

        // Restore dark mode settings
        if (localStorage.getItem('darkMode') === 'true') {
            document.body.classList.add('dark');
        }

        // Image preview
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // Check login status on page load
        window.onload = function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            if (isLoggedIn === 'true') {
                showInventoryScreen();
            }
        };

        // Handle login
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email === validCredentials.email && password === validCredentials.password) {
                localStorage.setItem('isLoggedIn', 'true');
                showInventoryScreen();
            } else {
                alert('Invalid email or password');
            }
        };

        // Logout
        function logout() {
            localStorage.setItem('isLoggedIn', 'false');
            document.getElementById('loginScreen').classList.remove('hidden');
            document.getElementById('inventoryScreen').classList.add('hidden');
            document.getElementById('loginForm').reset();
        }

        // Show inventory screen
        function showInventoryScreen() {
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('inventoryScreen').classList.remove('hidden');
            renderItems();
        }

        // Initialize variables
        let items = JSON.parse(localStorage.getItem('items')) || [];
        let editingId = null;

        // Render items
        function renderItems(itemsToShow = items) {
            const tbody = document.getElementById('itemsList');
            tbody.innerHTML = itemsToShow.map((item, index) => `
                <tr class="border-b">
                    <td class="p-4">
                        ${item.image ? `<img src="${item.image}" class="preview-image">` : ''}
                    </td>
                    <td class="p-4">${item.name}</td>
                    <td class="p-4">${item.price}</td>
                    <td class="p-4">${item.quantity}</td>
                    <td class="p-4">${item.category}</td>
                    <td class="p-4">
                        <button onclick="editItem(${index})" class="text-blue-500 mr-2">Edit</button>
                        <button onclick="deleteItem(${index})" class="text-red-500">Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        // Add/Edit product
        document.getElementById('itemForm').onsubmit = (e) => {
            e.preventDefault();
            const imagePreview = document.getElementById('imagePreview');
            const item = {
                name: document.getElementById('name').value,
                price: Number(document.getElementById('price').value),
                quantity: Number(document.getElementById('quantity').value),
                category: document.getElementById('category').value,
                image: imagePreview.classList.contains('hidden') ? null : imagePreview.src
            };

            if (editingId !== null) {
                items[editingId] = item;
                editingId = null;
                document.querySelector('button[type="submit"]').textContent = 'Add Beauty Product';
            } else {
                items.push(item);
            }

            localStorage.setItem('items', JSON.stringify(items));
            renderItems();
            e.target.reset();
            imagePreview.classList.add('hidden');
        };

        // Edit item
        function editItem(index) {
            const item = items[index];
            document.getElementById('name').value = item.name;
            document.getElementById('price').value = item.price;
            document.getElementById('quantity').value = item.quantity;
            document.getElementById('category').value = item.category;
            const imagePreview = document.getElementById('imagePreview');
            if (item.image) {
                imagePreview.src = item.image;
                imagePreview.classList.remove('hidden');
            } else {
                imagePreview.classList.add('hidden');
            }
            editingId = index;
            document.querySelector('button[type="submit"]').textContent = 'Update Beauty Product';
        }

        // Delete item
        function deleteItem(index) {
            if (confirm('Are you sure you want to delete this beauty product?')) {
                items.splice(index, 1);
                localStorage.setItem('items', JSON.stringify(items));
                renderItems();
            }
        }

        // Search
        document.getElementById('search').oninput = (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredItems = items.filter(item => 
                item.name.toLowerCase().includes(searchTerm) ||
                item.category.toLowerCase().includes(searchTerm)
            );
            renderItems(filteredItems);
        };
    </script>
</body>
</html>
